---
# Main quality gate. This repo's content is a Vale style and the docs
# around it, so the prose, spelling, Markdown, config, and YAML linters
# are its code gates and run here rather than staying local-only as in
# the Go siblings. Both jobs install the Brewfile toolchain (Homebrew is
# preinstalled on the ubuntu-24.04 runners) and sync the Vale styles,
# then run their gates through the `just` recipes so the Justfile stays
# the single definition of what each gate runs: the lint job runs the
# full lint bar via `just lint`, and the test job runs the fixture and
# template suite via `just test` (vale must be present to evaluate the
# fixtures). actionlint is absent from the lint bar: the standalone
# lint-workflows workflow already covers it.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The runner image ships Homebrew but leaves its prefix off PATH.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # vale comes from the pinned composite rather than the Brewfile, so
      # the prose gates run a known binary instead of whatever Homebrew
      # serves that day. It lands on PATH ahead of Homebrew's prefix, so
      # the Brewfile copy never shadows it.
      - name: Set up vale
        uses: proofhouse/github-actions/.github/actions/setup-vale@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      - name: Install Homebrew dependencies
        run: brew bundle install

      - name: Sync Vale styles
        run: just install-tools

      - name: Lint
        run: just lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The runner image ships Homebrew but leaves its prefix off PATH.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # vale comes from the pinned composite rather than the Brewfile, so
      # the prose gates run a known binary instead of whatever Homebrew
      # serves that day. It lands on PATH ahead of Homebrew's prefix, so
      # the Brewfile copy never shadows it.
      - name: Set up vale
        uses: proofhouse/github-actions/.github/actions/setup-vale@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      - name: Install Homebrew dependencies
        run: brew bundle install

      - name: Sync Vale styles
        run: just install-tools

      - name: Test
        run: just test
